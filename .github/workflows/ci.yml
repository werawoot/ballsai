name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public dummy values let Next.js compile without exposing any real key.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SHOW_DEMO_DATA: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check utility script syntax
        run: |
          node --check scripts/rls-smoke-test.mjs
          node --check scripts/verify-production-config.mjs
          node --check scripts/smoke-public-pages.mjs

      - name: Run lint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run script tests (node:test)
        # scripts/*.test.mjs pin the Team Roster route and RPC privilege rules; nothing ran
        # them, which is how merge 2111890 dropped the approve/decline/remove actions
        # without a check failing. Branches without such files skip the step, so this
        # workflow can be the same file on every branch.
        run: |
          set -- scripts/*.test.mjs
          if [ -e "$1" ]; then node --test "$@"; else echo "No scripts/*.test.mjs on this branch"; fi

      - name: Build production bundle
        run: npm run build
